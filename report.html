<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>센터 매출 관리 - 공유된 매출 보고</title>
<link rel="stylesheet" href="style.css?v=1788435542" />
<style>
  .snapshot-banner {
    background: #fef9c3; border: 1px solid #fde68a; color: #854d0e;
    border-radius: 12px; padding: 12px 16px; font-size: 13px; margin-bottom: 18px;
  }
  .wi-disabled { background: var(--slate-50); color: #cbd5e1; text-align: center; }
</style>
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo-badge" style="width:28px;height:28px;font-size:13px;margin:0;">C</span>센터 매출 관리 - 공유된 보고서</div>
  </div>

  <div class="wrap" id="reportWrap">
    <p class="muted" style="padding:16px;">불러오는 중...</p>
  </div>

  <script src="config.js?v=1788435542"></script>
  <script src="data.js?v=1788435542"></script>
  <script>
    function pad2(n) { return String(n).padStart(2, '0'); }

    function formatGeneratedAt(iso) {
      const d = new Date(iso);
      return `${d.getFullYear()}.${pad2(d.getMonth() + 1)}.${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())} 기준`;
    }

    function renderSalesTable(rows) {
      if (!rows || rows.length === 0) {
        return '<p class="muted" style="padding:12px 0;">등록된 매출이 없습니다.</p>';
      }
      return `
        <table style="margin-top:12px;">
          <thead><tr><th>날짜</th><th>회원명</th><th>항목</th><th>담당</th><th>결제수단</th><th style="text-align:right;">금액</th></tr></thead>
          <tbody>
            ${rows.map(r => `
              <tr>
                <td>${escapeHtml(r.date)}</td>
                <td>${escapeHtml(r.member)}</td>
                <td>${escapeHtml(r.item)}</td>
                <td>${escapeHtml(r.staff)}</td>
                <td>${escapeHtml(r.payment)}</td>
                <td style="text-align:right;">${formatWon(r.amount)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>`;
    }

    // 대시보드의 "매출 보고" 섹션과 똑같은 순서로 재현함: 지금 선택된 탭(일간/주간/월간 중 하나) 카드
    // + 표 -> 그 아래에 "이번 달 매출(항상 고정)" 카드. 둘 다 같은 .section 안에 같이 있는 게 실제
    // 대시보드 레이아웃과 동일함.
    function heroCardHtml(cls, icon, label, amount, count) {
      return `
        <div class="hero-card ${cls}">
          <div class="hero-icon">${icon}</div>
          <div class="hero-label">${label}</div>
          <div class="hero-value hero-value-money">${formatWon(amount)}</div>
          <div class="hero-sub">${count}건</div>
        </div>`;
    }

    function heroGridHtml(bucket) {
      return `
        <div class="hero-grid">
          ${heroCardHtml('hero-blue', '💰', '총매출 (FC+PT)', bucket.totalAmount, bucket.count)}
          ${heroCardHtml('hero-purple', '🏋️', 'FC매출 <span style="font-weight:400;">(헬스이용권·그룹PT·운동복·락커)</span>', bucket.fcAmount, bucket.fcCount)}
          ${heroCardHtml('hero-teal', '🤸', 'PT총매출 <span style="font-weight:400;">(개인PT)</span>', bucket.ptAmount, bucket.ptCount)}
        </div>`;
    }

    function renderReportSection(report, monthSummary) {
      return `
        <div class="section" style="margin-top:0;">
          <h2>${escapeHtml(report.title)} <span class="muted" style="font-weight:400; font-size:12px;">${escapeHtml(report.periodLabel)}</span></h2>
          ${heroGridHtml(report)}
          ${monthSummary ? `
            <p class="muted" style="margin:18px 0 8px;font-size:13px;font-weight:600;">📅 이번 달 매출 (항상 이번 달 고정)</p>
            ${heroGridHtml(monthSummary)}
          ` : ''}
          ${renderSalesTable(report.rows)}
        </div>`;
    }

    function renderCategoryRenewalSection(stats) {
      if (!stats) return '';
      function cardHtml(label, stat) {
        if (!stat || stat.total === 0) {
          return `<div class="stat-card"><div class="label">${label}</div><div class="value">-</div><div class="delta muted">이번 달 TM 기록 없음</div></div>`;
        }
        return `<div class="stat-card"><div class="label">${label}</div><div class="value">${stat.rate}%</div><div class="delta muted">${stat.total}건 중 재등록 ${stat.renewed}건</div></div>`;
      }
      return `
        <div class="section">
          <h2>이번 달 상품별 재등록 현황 <span class="muted" style="font-weight:400;font-size:12px;">(만료회원·TM 상태 기준)</span></h2>
          <div class="grid-3">
            ${cardHtml('헬스이용권 (FC)', stats.membership)}
            ${cardHtml('그룹PT', stats.group_pt)}
            ${cardHtml('개인PT', stats.pt)}
          </div>
        </div>`;
    }

    function renderRecentSalesSection(rows) {
      if (!rows) return '';
      const body = rows.length === 0
        ? '<tr><td colspan="5" class="muted" style="padding:16px;">등록된 매출이 없습니다.</td></tr>'
        : rows.map(r => `
            <tr>
              <td>${escapeHtml(r.date)}</td>
              <td>${escapeHtml(r.member)}</td>
              <td>${escapeHtml(r.item)}</td>
              <td>${escapeHtml(r.staff)}</td>
              <td style="text-align:right;">${formatWon(r.amount)}</td>
            </tr>`).join('');
      return `
        <div class="section">
          <h2>최근 매출 내역</h2>
          <table>
            <thead><tr><th>날짜</th><th>회원명</th><th>항목</th><th>담당</th><th style="text-align:right;">금액</th></tr></thead>
            <tbody>${body}</tbody>
          </table>
        </div>`;
    }

    const INQUIRY_CHANNEL_LABELS = ['전화', '네이버톡톡', '네이버예약', '인스타', '카카오', '당근'];

    function renderInquirySection(inquiry) {
      if (!inquiry || !inquiry.rows) return '';
      const rowsHtml = inquiry.rows.map(row => `
        <tr>
          <td style="white-space:nowrap;">${escapeHtml(row.label)}</td>
          ${row.channels.map(c => `<td style="text-align:center;">${c.count || 0}</td>`).join('')}
          <td class="muted" style="text-align:center; font-weight:700;">${row.total || 0}</td>
        </tr>
      `).join('');
      return `
        <div class="section">
          <h2>문의 경로 <span class="muted" style="font-weight:400; font-size:12px;">(${escapeHtml(inquiry.dateStr)})</span></h2>
          <div style="overflow-x:auto;">
            <table class="table-fixed sheet-table" style="min-width:680px;">
              <thead><tr>
                <th style="width:16%;">구분</th>${INQUIRY_CHANNEL_LABELS.map(l => `<th>${l}</th>`).join('')}<th style="width:8%;">합계</th>
              </tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>`;
    }

    const WORKIN_WEEKDAY_LABELS = ['월', '화', '수', '목', '금'];

    function renderWorkinSection(workin) {
      if (!workin || !workin.weeks) return '';
      let bodyHtml = '';
      workin.weeks.forEach(week => {
        ['success', 'fail'].forEach((result, idx) => {
          const bucket = week[result];
          const cellsHtml = bucket.days.map(d => {
            if (d.count === null) return '<td class="wi-disabled">-</td>';
            return `<td style="text-align:center;">${d.count || 0}</td>`;
          }).join('');
          const weekCell = idx === 0
            ? `<td rowspan="2" style="font-weight:700; background:var(--slate-50); vertical-align:middle; text-align:center;">${week.weekNo}주차<br /><span class="muted" style="font-weight:400; font-size:11px;">${escapeHtml(week.rangeLabel)}</span></td>`
            : '';
          const resultLabel = result === 'success' ? '✅ 성공' : '❌ 실패';
          bodyHtml += `<tr>${weekCell}<td>${resultLabel}</td>${cellsHtml}<td class="muted" style="text-align:center; font-weight:700;">${bucket.total || 0}</td></tr>`;
        });
      });
      const total = workin.totalSuccess + workin.totalFail;
      const rate = total > 0 ? `${(workin.totalSuccess / total * 100).toFixed(1)}%` : '-';
      return `
        <div class="section">
          <h2>상담 워크인 / 미스 <span class="muted" style="font-weight:400; font-size:12px;">(${escapeHtml(workin.monthLabel)})</span></h2>
          <div style="overflow-x:auto;">
            <table class="table-fixed sheet-table" style="min-width:620px;">
              <thead><tr>
                <th style="width:10%;">주차</th><th style="width:10%;">결과</th>
                ${WORKIN_WEEKDAY_LABELS.map(l => `<th>${l}</th>`).join('')}<th style="width:10%;">주간 합계</th>
              </tr></thead>
              <tbody>${bodyHtml}</tbody>
            </table>
          </div>
          <div class="grid-3" style="margin-top:16px;">
            <div class="stat-card"><div class="label">이번 달 총 성공</div><div class="value">${workin.totalSuccess}건</div></div>
            <div class="stat-card"><div class="label">이번 달 총 실패</div><div class="value">${workin.totalFail}건</div></div>
            <div class="stat-card"><div class="label">성공률</div><div class="value">${rate}</div></div>
          </div>
        </div>`;
    }

    function renderNotFound() {
      document.getElementById('reportWrap').innerHTML = `
        <div class="panel" style="margin-top:24px; text-align:center;">
          <p style="font-size:15px; font-weight:600; margin:0 0 6px;">이 링크는 존재하지 않거나 삭제되었어요.</p>
          <p class="muted" style="margin:0;">링크를 다시 확인해주시거나, 보고서를 만든 분에게 새 링크를 요청해주세요.</p>
        </div>`;
    }

    (async () => {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      if (!id) { renderNotFound(); return; }

      try {
        const snapshot = await fetchPublicReportShare(id);
        if (!snapshot) { renderNotFound(); return; }

        document.getElementById('reportWrap').innerHTML = `
          <div class="snapshot-banner">
            📌 이 페이지는 <b>${formatGeneratedAt(snapshot.generated_at)}</b>${snapshot.generated_by ? ` (${escapeHtml(snapshot.generated_by)}님이 생성)` : ''}에 고정된 스냅샷이에요. 실시간 데이터가 아니라서, 이후 매출이 추가돼도 여기 숫자는 바뀌지 않아요.
          </div>
          ${renderReportSection(snapshot.report, snapshot.monthSummary)}
          ${renderCategoryRenewalSection(snapshot.categoryRenewal)}
          ${renderRecentSalesSection(snapshot.recentSales)}
          ${renderInquirySection(snapshot.inquiry)}
          ${renderWorkinSection(snapshot.workin)}
        `;
      } catch (err) {
        document.getElementById('reportWrap').innerHTML = `<p class="error-text" style="display:block; padding:16px;">${escapeHtml(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
