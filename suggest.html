<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>마음의 소리함</title>
<!--
  회원용 건의함 화면. attend.html처럼 "로그인 없이" 열리는 화면이라 auth.js/data.js를 쓰지 않고
  config.js의 공개 키(anon)로 submit_suggestion() 함수 하나만 호출해요 (migration_84).
  이름·연락처 칸도 없는 완전 익명 화면이에요. 입력 칸 말고는 아무 것도 안 보여줘요 - 다른 회원이 쓴 글이나 센터 내부 정보는 이 화면에서 절대 읽을 수 없어요.
-->
<style>
  :root { --brand: #3D5FFF; --brand-dark: #2A46E0; --brand-bg: #EEF1FF; --ink: #16192E; --muted: #6B7280; --line: #E7E9F2; --panel: #F6F7FB; --green: #16A34A; --green-bg: #E7F8ED; --red: #DC2626; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; color: var(--ink); max-width: 480px; margin: 0 auto; min-height: 100vh; }
  .hero { padding: 34px 24px 6px; }
  .hero .ic { font-size: 36px; }
  .hero h1 { margin: 8px 0 6px; font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .hero p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.6; }
  form, .done { padding: 18px 24px 40px; }
  label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 6px; }
  label small { font-weight: 500; color: var(--muted); }
  textarea, input[type=text] { width: 100%; border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 14px 16px; font-size: 16px; font-family: inherit; color: var(--ink); outline: none; }
  textarea { min-height: 190px; resize: vertical; line-height: 1.55; }
  textarea:focus, input[type=text]:focus { border-color: var(--brand); background: #fff; }
  .count { text-align: right; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .btn { display: block; width: 100%; margin-top: 22px; padding: 16px 0; border: none; border-radius: 14px; background: var(--brand); color: #fff; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer; }
  .btn:disabled { background: #C7CCE0; cursor: default; }
  .btn:not(:disabled):active { background: var(--brand-dark); }
  .btn.sub { background: var(--brand-bg); color: var(--brand); }
  .err { margin-top: 12px; color: var(--red); font-size: 13px; line-height: 1.5; display: none; }
  .note { margin-top: 14px; font-size: 12px; color: var(--muted); line-height: 1.6; text-align: center; }
  .done { display: none; text-align: center; padding-top: 70px; }
  .done .big { font-size: 54px; }
  .done h2 { margin: 12px 0 8px; font-size: 21px; }
  .done p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; opacity: 0; }
</style>
</head>
<body>
  <div class="hero">
    <div class="ic">💌</div>
    <h1>마음의 소리함</h1>
    <p>센터에 바라는 점, 불편했던 점, 칭찬하고 싶은 점을 편하게 남겨주세요. 남겨주신 글은 <b>호석 매니저에게 직접 보고</b>돼요. 모든 요청을 다 해결해드릴 수는 없지만, 최고의 서비스를 제공해드리기 위해 최선을 다해 노력하겠습니다.</p>
  </div>

  <form id="form" autocomplete="off">
    <label for="content">하고 싶은 말씀</label>
    <textarea id="content" maxlength="2000" placeholder="예) 샤워실 온도가 오후에 너무 차가워요 / 이런 수업이 생기면 좋겠어요" required></textarea>
    <div class="count"><span id="cnt">0</span> / 2000</div>

    <!-- 자동 입력 프로그램(스팸) 걸러내기용 숨김 칸 - 사람은 못 보니 비어 있어야 정상 -->
    <input type="text" id="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true" />

    <button type="submit" class="btn" id="sendBtn" disabled>보내기</button>
    <div class="err" id="err"></div>
    <div class="note">🔒 이름도 연락처도 받지 않아요.<br>완전히 익명으로 전달되니 편하게 적어주세요.</div>
  </form>

  <div class="done" id="done">
    <div class="big">🙏</div>
    <h2>소중한 의견 감사합니다</h2>
    <p>호석 매니저에게 직접 보고돼요.<br>모든 요청을 다 해결해드리진 못해도<br>최고의 서비스를 위해 최선을 다해 노력하겠습니다.</p>
    <button type="button" class="btn sub" id="againBtn" style="margin-top:34px;">다른 의견 하나 더 쓰기</button>
  </div>

  <script src="config.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const contentEl = $('content'), sendBtn = $('sendBtn'), errEl = $('err');
    let sending = false;

    function refresh() {
      $('cnt').textContent = contentEl.value.length;
      sendBtn.disabled = sending || contentEl.value.trim().length === 0;
    }
    contentEl.addEventListener('input', refresh);

    function showError(msg) { errEl.textContent = msg; errEl.style.display = 'block'; }

    $('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (sending) return;
      errEl.style.display = 'none';
      const content = contentEl.value.trim();
      if (!content) return;
      // 같은 폰에서 연타로 여러 번 보내는 것 방지(20초에 한 번)
      try {
        const last = Number(localStorage.getItem('suggest_last') || 0);
        if (Date.now() - last < 20000) { showError('방금 보내셨어요. 잠시 후 다시 보내주세요.'); return; }
      } catch (err) { /* 저장소를 못 써도 전송은 가능 */ }
      sending = true; sendBtn.disabled = true; sendBtn.textContent = '보내는 중...';
      try {
        if ($('website').value) { // 숨김 칸이 채워졌다 = 자동 프로그램. 성공한 것처럼 보이게만 하고 실제로는 저장 안 함
          finish(); return;
        }
        const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/submit_suggestion`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
          body: JSON.stringify({ p_content: content, p_contact: null })
        });
        if (res.status === 404) throw new Error('건의함이 아직 준비 중이에요. 센터 직원에게 말씀해주세요.');
        let data = null;
        try { data = await res.json(); } catch (err) { /* 아래에서 처리 */ }
        if (!res.ok) throw new Error((data && data.message) || '전송에 실패했어요. 잠시 후 다시 시도해주세요.');
        const row = Array.isArray(data) ? data[0] : data;
        if (row && row.ok === false) throw new Error(row.message || '전송에 실패했어요.');
        try { localStorage.setItem('suggest_last', String(Date.now())); } catch (err) { /* ignore */ }
        finish();
      } catch (err) {
        showError(err.message || '전송에 실패했어요. 인터넷 연결을 확인하고 다시 시도해주세요.');
        sending = false; sendBtn.textContent = '보내기'; refresh();
      }
    });

    function finish() {
      sending = false; sendBtn.textContent = '보내기';
      $('form').style.display = 'none'; $('done').style.display = 'block';
      window.scrollTo(0, 0);
    }
    $('againBtn').addEventListener('click', () => {
      contentEl.value = ''; refresh();
      $('done').style.display = 'none'; $('form').style.display = 'block';
    });
    refresh();
  </script>
</body>
</html>
