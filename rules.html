<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("gymops_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
<title>센터 매출 관리 - 센터 규정 · 업무 매뉴얼</title>
<link rel="stylesheet" href="style.css?v=1791480155" />
<style>
  .rules-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
  @media (max-width: 900px) { .rules-layout { grid-template-columns: minmax(0, 1fr); } }
  .cats { background: var(--surface); border: 1px solid var(--slate-200); border-radius: 14px; padding: 10px; position: sticky; top: 12px; }
  .cat-btn { display: flex; justify-content: space-between; width: 100%; padding: 10px 12px; border: none; background: none; border-radius: 9px; font-size: 14px; font-weight: 600; color: var(--slate-700); cursor: pointer; text-align: left; }
  .cat-btn:hover { background: var(--slate-50); }
  .cat-btn.on { background: var(--indigo-600); color: #fff; }
  .cat-btn span { opacity: .7; font-weight: 500; }
  .quick-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 16px; }
  .quick-card { background: var(--surface); border: 1px solid var(--slate-200); border-radius: 14px; padding: 14px; }
  .quick-card h4 { margin: 0 0 8px; font-size: 14px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 7px; padding: 3px 9px; margin: 2px 4px 2px 0; white-space: nowrap; }
  .chip-no { background: #fee2e2; color: #b91c1c; }
  .chip-ok { background: #dcfce7; color: #15803d; }
  .chip-wait { background: #fef3c7; color: #92400e; }
  .rule { background: var(--surface); border: 1px solid var(--slate-200); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
  .rule.pinned { border-color: var(--amber-500); }
  .rule-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px; cursor: pointer; flex-wrap: wrap; }
  .rule-head:hover { background: var(--slate-50); }
  .rule-head h3 { margin: 0; font-size: 16px; }
  .rule-head .sum { color: var(--slate-500); font-size: 13px; }
  .rule-head .arrow { margin-left: auto; font-size: 14px; color: var(--slate-400); }
  .rule-body { display: none; padding: 6px 22px 18px; border-top: 1px dashed var(--slate-200); font-size: 14px; line-height: 1.75; }
  .rule.open .rule-body { display: block; }
  .step { display: flex; gap: 10px; margin: 9px 0; }
  .step i { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--indigo-600); color: #fff; font-style: normal; font-weight: 800; font-size: 12.5px; text-align: center; line-height: 24px; }
  .warn { background: #fef3c7; color: #92400e; border-radius: 10px; padding: 9px 12px; margin: 10px 0; font-size: 13.5px; }
  .rule-meta { font-size: 11.5px; color: var(--slate-400); margin-top: 12px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .rule-search { width: 300px; max-width: 100%; padding: 10px 14px; border: 1px solid var(--slate-300); border-radius: 10px; font-size: 14px; background: var(--surface); color: inherit; }
  mark { background: #fde68a; color: inherit; border-radius: 3px; padding: 0 1px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; font-weight: 700; margin-bottom: 5px; color: var(--slate-700); }
  .field input[type=text], .field select, .field textarea { width: 100%; box-sizing: border-box; padding: 9px 10px; font-size: 14px; border: 1px solid var(--slate-300); border-radius: 8px; background: var(--surface); color: inherit; font-family: inherit; }
  .chip-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .chip-row > div { flex: 1 1 140px; }
  #ruleModal .modal-box { max-width: 640px; }
</style>
</head>

  <div class="wrap">

      <div style="display:flex; flex-direction:column; gap:2px;">
        <h1 style="margin:0; font-size:19px; font-weight:800;">📘 센터 규정 · 업무 매뉴얼</h1>
        <span class="muted">환불 · 양도 · 이용권 규정이 헷갈릴 때 바로 찾아보세요</span>

  <!-- 규정 추가/수정 창 (지점장 전용) -->

      <div class="field"><label>제목</label><input type="text" id="rf_title" maxlength="80" placeholder="예) 환불 요청이 들어왔을 때 진행 절차" /></div>

        <div class="field" style="flex:1 1 200px;"><label>적용 대상 <span class="muted" style="font-weight:400;">(첫 화면 요약 칸 이름)</span></label>
          <input type="text" id="rf_target" list="targetList" maxlength="30" placeholder="예) 무료 이용권" /><datalist id="targetList"></datalist></div>
      </div>
      <div class="field"><label>한 줄 설명 <span class="muted" style="font-weight:400;">(제목 옆에 작게 보여요)</span></label><input type="text" id="rf_summary" maxlength="100" /></div>
      <div class="field"><label>본문</label>
        <textarea id="rf_body" rows="9" placeholder="1. 첫 번째 할 일&#10;2. 두 번째 할 일&#10;※ 꼭 주의할 점"></textarea>
        <div class="muted" style="font-size:12px; margin-top:4px;"><strong>1.</strong> <strong>2.</strong> 로 시작하는 줄은 번호 단계로, <strong>※</strong> 로 시작하는 줄은 노란 주의 박스로 보여요.</div>
      </div>
      <div class="field"><label>되나요 / 안 되나요 요약 칩 <span class="muted" style="font-weight:400;">(첫 화면 위쪽 칸에 모여서 보여요)</span></label>
        <div class="chip-row">
          <div><span class="muted" style="font-size:12px;">양도</span><select id="rf_chip_transfer"></select></div>
          <div><span class="muted" style="font-size:12px;">환불</span><select id="rf_chip_refund"></select></div>

        </div>

      <label style="display:flex; align-items:center; gap:6px; font-size:13.5px; cursor:pointer;"><input type="checkbox" id="rf_pinned" /> 📌 중요 규정으로 맨 위에 고정</label>
      <div id="ruleModalError" class="error-text" style="display:none; margin-top:10px;"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:18px;">
        <button type="button" class="btn" id="ruleCancelBtn" style="width:auto; padding:8px 16px;">취소</button>
        <button type="button" class="btn btn-primary" id="ruleSaveBtn" style="width:auto; padding:8px 18px;">저장</button>

  <script src="auth.js?v=1791480155"></script>
  <script src="data.js?v=1791480155"></script>
  <script>
    requireLogin();
    document.getElementById('logoutBtn').addEventListener('click', signOut);

    let isManager = false;
    let currentUserId = null;
    let rules = [];
    let activeCat = 'all';
    let searchText = '';
    const openIds = new Set();
    let editingId = null;

    const CATEGORIES = [
      { key: 'refund', label: '환불', icon: '💳', badge: 'badge-red' },
      { key: 'transfer', label: '양도', icon: '🔁', badge: 'badge-blue' },
      { key: 'free', label: '무료·이벤트 이용권', icon: '🎁', badge: 'badge-purple' },
      { key: 'hold', label: '홀딩·연장', icon: '⏳', badge: 'badge-amber' },
      { key: 'locker', label: '락커·운동복', icon: '🔒', badge: 'badge-teal' },
      { key: 'pt', label: 'PT·그룹PT', icon: '🤸', badge: 'badge-green' },
      { key: 'etc', label: '기타', icon: '📌', badge: 'badge-slate' }
    ];
    const CAT = {};
    CATEGORIES.forEach(c => { CAT[c.key] = c; });
    const CHIP_STATES = ['', '가능', '불가', '조건부'];

    function chipClass(label) {
      if (label.endsWith('불가')) return 'chip-no';
      if (label.endsWith('가능')) return 'chip-ok';
      return 'chip-wait';
    }
    function chipsHtml(chips) {
      return (chips || []).map(c => `<span class="chip ${chipClass(c)}">${escapeHtml(c)}</span>`).join('');
    }

    // 검색어와 일치하는 글자를 노란색으로 표시 (HTML 이스케이프를 먼저 하고 그 위에 표시)
    function highlight(text) {
      const safe = escapeHtml(text);
      const q = searchText.trim();
      if (!q) return safe;
      const re = new RegExp(escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      return safe.replace(re, m => `<mark>${m}</mark>`);
    }

    // 본문 표시: "1." 로 시작하는 줄 = 번호 단계, "※" 로 시작하는 줄 = 주의 박스, 나머지는 문단
    function renderBody(body) {
      const lines = String(body || '').split(/\r?\n/);
      const out = [];
      for (const raw of lines) {
        const line = raw.trim();
        if (!line) continue;
        const step = line.match(/^(\d+)\s*[.)]\s*(.*)$/);
        if (step) { out.push(`<div class="step"><i>${step[1]}</i><div>${highlight(step[2])}</div></div>`); continue; }
        if (/^[※⚠!]/.test(line)) { out.push(`<div class="warn">⚠️ ${highlight(line.replace(/^[※⚠!]\s*/, ''))}</div>`); continue; }
        out.push(`<p style="margin:8px 0;">${highlight(line)}</p>`);
      }
      return out.join('') || '<p class="muted">본문이 아직 없어요.</p>';
    }

    function matchesSearch(r) {
      const q = searchText.trim().toLowerCase();
      if (!q) return true;
      const cat = CAT[r.category] ? CAT[r.category].label : '';
      return [r.title, r.summary, r.body, r.target, cat, (r.chips || []).join(' ')]
        .some(v => String(v || '').toLowerCase().includes(q));
    }

    function renderCats() {
      const counts = {};
      rules.forEach(r => { counts[r.category] = (counts[r.category] || 0) + 1; });
      const items = [{ key: 'all', icon: '', label: '전체', n: rules.length }]
        .concat(CATEGORIES.filter(c => counts[c.key] || c.key === activeCat).map(c => ({ key: c.key, icon: c.icon + ' ', label: c.label, n: counts[c.key] || 0 })));
      document.getElementById('catList').innerHTML = items.map(i =>
        `<button type="button" class="cat-btn${i.key === activeCat ? ' on' : ''}" data-key="${i.key}">${i.icon}${i.label} <span>${i.n}</span></button>`
      ).join('');
      document.querySelectorAll('#catList .cat-btn').forEach(b => b.addEventListener('click', () => { activeCat = b.dataset.key; render(); }));
    }

    // 첫 화면 위쪽 요약 칸: 같은 "적용 대상"의 칩을 모아서 보여줌
    function sortChips(chips) {
      const rank = c => { const i = ['양도', '환불', '홀딩'].findIndex(t => c.startsWith(t)); return i < 0 ? 9 : i; };
      return chips.slice().sort((a, b) => rank(a) - rank(b));
    }
    function renderQuick() {
      const byTarget = new Map();
      rules.forEach(r => {
        if (!r.target || !(r.chips || []).length) return;
        if (!byTarget.has(r.target)) byTarget.set(r.target, []);
        (r.chips || []).forEach(c => { if (!byTarget.get(r.target).includes(c)) byTarget.get(r.target).push(c); });
      });
      const grid = document.getElementById('quickGrid');
      grid.style.display = byTarget.size ? 'grid' : 'none';
      grid.innerHTML = Array.from(byTarget.entries()).map(([t, chips]) =>
        `<div class="quick-card"><h4>${escapeHtml(t)}</h4>${chipsHtml(sortChips(chips))}</div>`).join('');
    }

    function renderList() {
      const list = rules
        .filter(r => (activeCat === 'all' || r.category === activeCat) && matchesSearch(r))
        .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      const el = document.getElementById('ruleList');
      if (!list.length) {
        el.innerHTML = rules.length === 0
          ? `<p class="muted">아직 등록된 규정이 없어요.${isManager ? ' 오른쪽 위 "+ 규정 추가"로 첫 규정을 써보세요.' : ''}</p>`
          : '<p class="muted">검색 결과가 없어요. 다른 단어로 찾아보세요.</p>';
        return;
      }
      const autoOpen = searchText.trim() && list.length <= 3;
      el.innerHTML = list.map(r => {
        const c = CAT[r.category] || CAT.etc;
        const isOpen = openIds.has(r.id) || autoOpen;
        const when = r.updated_at ? r.updated_at.slice(0, 10) : '';
        return `
        <div class="rule${r.pinned ? ' pinned' : ''}${isOpen ? ' open' : ''}" data-id="${r.id}">
          <div class="rule-head" data-toggle="${r.id}">
            <span class="badge ${c.badge}">${c.label}</span>
            <h3>${r.pinned ? '📌 ' : ''}${highlight(r.title)}</h3>
            ${r.summary ? `<span class="sum">— ${highlight(r.summary)}</span>` : ''}
            <span>${chipsHtml(r.chips)}</span>
            <span class="arrow">${isOpen ? '▲' : '▼'}</span>
          </div>
          <div class="rule-body">
            ${renderBody(r.body)}
            <div class="rule-meta">
              <span>최종 수정 ${when}${r.editor && r.editor.name ? ' · ' + escapeHtml(r.editor.name) : ''}</span>
              ${isManager ? `<button type="button" class="btn-link" data-edit="${r.id}">수정</button><button type="button" class="btn-link" style="color:var(--red-600);" data-del="${r.id}">삭제</button>` : ''}
            </div>
          </div>
        </div>`;
      }).join('');
      el.querySelectorAll('[data-toggle]').forEach(h => h.addEventListener('click', () => {
        const id = h.dataset.toggle;
        if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
        renderList();
      }));
      el.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openEditor(b.dataset.edit)));
      el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => deleteRule(b.dataset.del)));
    }

    function render() { renderCats(); renderQuick(); renderList(); }

    // ---- 추가/수정 창 ----
    function fillChipSelect(id, topic, current) {
      const sel = document.getElementById(id);
      sel.innerHTML = CHIP_STATES.map(st => {
        const label = st ? `${topic} ${st}` : '';
        return `<option value="${label}" ${label === current ? 'selected' : ''}>${st ? label : '해당 없음'}</option>`;
      }).join('');
    }
    function chipFor(chips, topic) { return (chips || []).find(c => c.startsWith(topic + ' ')) || ''; }

    function openEditor(id) {
      editingId = id || null;
      const r = id ? rules.find(x => x.id === id) : null;
      document.getElementById('ruleModalTitle').textContent = r ? '규정 수정' : '규정 추가';
      document.getElementById('rf_title').value = r ? r.title : '';
      document.getElementById('rf_category').innerHTML = CATEGORIES.map(c =>
        `<option value="${c.key}" ${(r ? r.category : (activeCat !== 'all' ? activeCat : 'etc')) === c.key ? 'selected' : ''}>${c.icon} ${c.label}</option>`).join('');
      document.getElementById('rf_target').value = r ? (r.target || '') : '';
      const targets = Array.from(new Set(rules.map(x => x.target).filter(Boolean)));
      document.getElementById('targetList').innerHTML = targets.map(t => `<option value="${escapeHtml(t)}"></option>`).join('');
      document.getElementById('rf_summary').value = r ? (r.summary || '') : '';
      document.getElementById('rf_body').value = r ? (r.body || '') : '';
      fillChipSelect('rf_chip_transfer', '양도', chipFor(r && r.chips, '양도'));
      fillChipSelect('rf_chip_refund', '환불', chipFor(r && r.chips, '환불'));
      fillChipSelect('rf_chip_hold', '홀딩', chipFor(r && r.chips, '홀딩'));
      document.getElementById('rf_pinned').checked = !!(r && r.pinned);
      document.getElementById('ruleModalError').style.display = 'none';
      document.getElementById('ruleModal').style.display = 'flex';
      document.getElementById('rf_title').focus();
    }
    function closeEditor() { document.getElementById('ruleModal').style.display = 'none'; }

    async function saveRule() {
      const errEl = document.getElementById('ruleModalError');
      const title = document.getElementById('rf_title').value.trim();
      if (!title) { errEl.textContent = '제목을 입력해주세요.'; errEl.style.display = 'block'; return; }
      const chips = ['rf_chip_transfer', 'rf_chip_refund', 'rf_chip_hold'].map(id => document.getElementById(id).value).filter(Boolean);
      const payload = {
        title, category: document.getElementById('rf_category').value,
        target: document.getElementById('rf_target').value.trim() || null,
        summary: document.getElementById('rf_summary').value.trim() || null,
        body: document.getElementById('rf_body').value.trim() || null,
        chips, pinned: document.getElementById('rf_pinned').checked, updated_by: currentUserId
      };
      const btn = document.getElementById('ruleSaveBtn');
      btn.disabled = true;
      try {
        if (editingId) await updateCenterRule(editingId, payload);
        else await addCenterRule(payload);
        closeEditor();
        await loadRules();
        showToast('규정을 저장했어요.');
      } catch (err) {
        errEl.textContent = err.message; errEl.style.display = 'block';
      } finally { btn.disabled = false; }
    }

    async function deleteRule(id) {
      const r = rules.find(x => x.id === id);
      if (!r || !confirm(`'${r.title}' 규정을 삭제할까요? (되돌릴 수 없어요)`)) return;
      try {
        await deleteCenterRule(id);
        openIds.delete(id);
        await loadRules();
        showToast('규정을 삭제했어요.', 'danger');
      } catch (err) { alert(err.message); }
    }

    async function loadRules() {
      try {
        rules = await fetchCenterRules();
        render();
      } catch (err) {
        document.getElementById('ruleList').innerHTML =
          `<p class="error-text" style="display:block;">${escapeHtml(err.message)}<br><span class="muted">(Supabase에서 migration_76_center_rules.sql을 아직 실행하지 않았다면 먼저 실행해주세요)</span></p>`;
      }
    }

    document.getElementById('ruleSearch').addEventListener('input', (e) => { searchText = e.target.value; renderList(); });
    document.getElementById('addRuleBtn').addEventListener('click', () => openEditor(null));
    document.getElementById('ruleModalClose').addEventListener('click', closeEditor);
    document.getElementById('ruleCancelBtn').addEventListener('click', closeEditor);
    document.getElementById('ruleSaveBtn').addEventListener('click', saveRule);

    (async () => {
      const profile = await getMyProfile();
      if (profile) {
        document.getElementById('roleBadge').textContent = `${roleLabelOf(profile)} · ${profile.name}`;
        applyRoleNav(profile);
        currentUserId = profile.id;
        isManager = profile.role === 'manager';
      }
      document.getElementById('addRuleBtn').style.display = isManager ? 'inline-block' : 'none';
      loadRules();
    })();
  </script>
</body>
</html>
