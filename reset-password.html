<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("gymops_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
<title>센터 매출 관리 - 새 비밀번호 설정</title>
<link rel="stylesheet" href="style.css?v=1790335678" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-hero">
      <div class="auth-hero-inner">
        <img class="auth-hero-logo" src="assets/logo-lockup.png" alt="Everywhere Fitness" />
        <p class="auth-hero-tagline">사용하실 새 비밀번호를 입력해주세요</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-inner">
        <div id="invalidView" style="display:none; text-align:center;">
          <div class="auth-header" style="text-align:center;">
            <div class="auth-brand"><span>Everywhere</span><span>Fitness</span></div>
            <h1>링크가 만료됐어요</h1>
          </div>
          <p style="font-size:14.5px; color:var(--slate-700); margin:0 0 20px; line-height:1.6;">
            링크가 만료됐거나 이미 사용된 링크예요.<br />비밀번호 찾기를 다시 시도해주세요.
          </p>
          <a href="forgot-password.html" class="auth-btn" style="display:block; box-sizing:border-box; text-decoration:none; line-height:1.6;">비밀번호 찾기로 이동</a>
        </div>

        <div id="formView" style="display:none;">
          <div class="auth-header">
            <div class="auth-brand"><span>Everywhere</span><span>Fitness</span></div>
            <h1>새 비밀번호 설정</h1>
            <p>사용하실 새 비밀번호를 입력해주세요</p>
          </div>

          <div id="errorBox" class="error-text"></div>

          <form id="resetForm">
            <div class="auth-field">
              <div class="auth-field-head">
                <label>새 비밀번호</label>
              </div>
              <div class="auth-password-wrap">
                <input type="password" id="password" placeholder="6자 이상" minlength="6" autocomplete="new-password" required />
                <button type="button" class="auth-toggle-pw" id="togglePwBtn" aria-label="비밀번호 표시">👁️</button>
              </div>
            </div>
            <div class="auth-field">
              <div class="auth-field-head">
                <label>새 비밀번호 확인</label>
              </div>
              <input type="password" id="passwordConfirm" placeholder="한 번 더 입력해주세요" minlength="6" autocomplete="new-password" required />
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">비밀번호 변경하기</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js?v=1790335678"></script>
  <script src="auth.js?v=1790335678"></script>
  <script>
    // 메일 속 링크를 누르면 Supabase가 검증 후 #access_token=...&type=recovery 형태의 해시를 붙여서
    // 이 페이지로 돌려보냄. 주소창/방문기록에 토큰이 그대로 남아있지 않도록, 읽자마자 해시를 지움.
    const hashParams = new URLSearchParams(location.hash.slice(1));
    const accessToken = hashParams.get('access_token');
    const linkType = hashParams.get('type');
    if (location.hash) history.replaceState(null, '', location.pathname);

    const invalidView = document.getElementById('invalidView');
    const formView = document.getElementById('formView');

    if (!accessToken || linkType !== 'recovery') {
      invalidView.style.display = 'block';
    } else {
      formView.style.display = 'block';
    }

    document.getElementById('togglePwBtn')?.addEventListener('click', () => {
      const pwInput = document.getElementById('password');
      const btn = document.getElementById('togglePwBtn');
      const showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁️' : '🙈';
    });

    const form = document.getElementById('resetForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form?.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';

      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('passwordConfirm').value;

      if (password !== passwordConfirm) {
        errorBox.textContent = '비밀번호가 서로 일치하지 않아요.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '변경하는 중...';

      try {
        await updatePasswordWithRecoveryToken(accessToken, password);
        location.href = 'login.html?reset=1';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '비밀번호 변경하기';
      }
    });
  </script>
</body>
</html>
