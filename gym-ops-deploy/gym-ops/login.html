<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>센터 매출 관리 - 로그인</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-screen">
    <div class="container" style="max-width:360px;">
      <div class="text-center" style="margin-bottom:28px;">
        <div class="logo-badge">C</div>
        <h1 class="title">센터 매출 관리</h1>
        <p class="subtitle">로그인하고 매출 · 회원 현황을 확인하세요</p>
      </div>

      <div class="card">
        <div id="errorBox" class="error-text"></div>

        <form id="loginForm">
          <div class="field">
            <label>이메일</label>
            <input type="email" id="email" placeholder="you@example.com" required />
          </div>
          <div class="field">
            <label>비밀번호</label>
            <input type="password" id="password" placeholder="••••••••" required />
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn">로그인</button>
        </form>
      </div>

      <p class="hint">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script>
    // 이미 로그인되어 있으면 바로 홈 화면으로
    if (getSession()) location.href = 'home.html';

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    // 로그인 세션이 만료되어 자동으로 이 페이지로 넘어온 경우 안내 문구 표시
    if (new URLSearchParams(location.search).get('expired') === '1') {
      errorBox.textContent = '로그인이 만료되어 다시 로그인해주세요.';
      errorBox.style.display = 'block';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '로그인 중...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signIn(email, password);
        location.href = 'home.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
