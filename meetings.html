<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>센터 매출 관리 - 미팅 기록일지</title>
<link rel="stylesheet" href="style.css?v=1788433762" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo-badge" style="width:28px;height:28px;font-size:13px;margin:0;">C</span>센터 매출 관리</div>
    <div class="topnav">
      <a href="home.html">홈</a>
      <a href="dashboard.html">대시보드</a>
      <a href="members.html">회원 관리</a>
      <a href="sales.html">매출 입력</a>
      <a href="center-sales.html">센터 매출</a>
      <a href="expiry.html">만료회원 · TM</a>
      <a href="pt.html">PT 관리</a>
      <a href="schedule.html">PT 스케줄</a>
      <a href="tasks.html">업무 리스트</a>
      <a href="meetings.html" class="active">미팅 기록</a>
      <a href="products.html">이용권 관리</a>
      <a href="staff.html">직원 관리</a>
      <a href="accounts.html">계정 관리</a>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div class="user-badge" id="roleBadge">로딩 중...</div>
      <button class="btn-link" id="logoutBtn">로그아웃</button>
    </div>
  </div>

  <div class="wrap">
    <div class="panel">
      <h3>미팅 기록 추가</h3>
      <p class="muted" style="margin:-6px 0 12px;">
        직원 회의(지점장·트레이너) 내용을 기록해두는 곳이에요. 직접 타이핑해도 되고,
        "AI 녹음 시작"을 누르면 마이크로 회의를 녹음했다가 멈추는 순간 자동으로 텍스트로 옮기고 요약까지 해줘요
        (전사/요약 내용은 저장 전에 자유롭게 고칠 수 있어요).
      </p>
      <div id="addErrorBox" class="error-text"></div>
      <div id="addSuccessBox" class="success-text"></div>
      <form id="addMeetingForm">
        <div class="form-grid" style="margin-bottom:12px;">
          <div class="field"><label>회의 날짜</label><input type="date" id="mt_date" required /></div>
          <div class="field" style="grid-column: span 2;"><label>제목</label><input type="text" id="mt_title" placeholder="예: 8월 4주차 직원회의" required /></div>
          <div class="field"><label>참석자</label><input type="text" id="mt_attendees" placeholder="예: 이호석, 김유빈" /></div>
        </div>

        <div class="card" style="padding:14px; margin-bottom:14px; background:var(--slate-50);">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <button type="button" class="btn btn-primary" id="recStartBtn" style="width:auto; padding-left:18px; padding-right:18px;">🎙️ AI 녹음 시작</button>
            <button type="button" class="btn btn-outline" id="recStopBtn" style="width:auto; padding-left:18px; padding-right:18px; display:none;">⏹ 녹음 중지</button>
            <span id="recTimer" class="muted" style="display:none;">00:00</span>
            <span id="recStatus" class="muted"></span>
          </div>
          <div id="recErrorBox" class="error-text" style="margin-top:10px; margin-bottom:0;"></div>
        </div>

        <div class="form-grid" style="margin-bottom:12px; grid-template-columns: 1fr;">
          <div class="field">
            <label>AI 요약 (녹음하면 자동으로 채워져요 · 직접 수정 가능)</label>
            <textarea id="mt_summary" rows="5" placeholder="AI 녹음을 사용하면 여기에 핵심 내용/결정사항/할 일이 자동으로 정리돼요. 직접 입력해도 됩니다." style="width:100%; resize:vertical; padding:9px 12px; border:1px solid var(--slate-200); border-radius:9px; font:inherit;"></textarea>
          </div>
          <div class="field">
            <label>메모 (자유 메모)</label>
            <textarea id="mt_memo" rows="2" placeholder="예: 다음 회의 전까지 락커룸 청소 당번표 공유하기" style="width:100%; resize:vertical; padding:9px 12px; border:1px solid var(--slate-200); border-radius:9px; font:inherit;"></textarea>
          </div>
          <div class="field">
            <label>전체 대화 전사 (AI 녹음 결과 · 필요할 때만 펼쳐보세요)</label>
            <textarea id="mt_transcript" rows="4" placeholder="AI 녹음을 사용하면 회의 전체 내용이 텍스트로 여기에 담겨요." style="width:100%; resize:vertical; padding:9px 12px; border:1px solid var(--slate-200); border-radius:9px; font:inherit;"></textarea>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width:auto; padding-left:24px; padding-right:24px;">저장</button>
      </form>
    </div>

    <div class="section">
      <h2>미팅 기록 목록</h2>
      <div id="meetingListBody">
        <p class="muted" style="padding:16px;">불러오는 중...</p>
      </div>
    </div>
  </div>

  <script src="config.js?v=1788433762"></script>
  <script src="auth.js?v=1788433762"></script>
  <script src="data.js?v=1788433762"></script>
  <script>
    requireLogin();
    document.getElementById('logoutBtn').addEventListener('click', signOut);

    let currentUserId = null;
    let currentUserRole = null;
    let meetingsCache = [];
    let mediaRecorder = null;
    let audioChunks = [];
    let recTimerHandle = null;
    let recSeconds = 0;

    document.getElementById('mt_date').value = new Date().toISOString().slice(0, 10);

    function fmtTimer(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    // ---- AI 녹음 ----
    // 브라우저 마이크 권한을 받아 녹음을 시작. 멈추면 녹음 파일을 transcribeAndSummarize()로 보내서
    // 전사+요약을 자동으로 받아와 화면 칸에 채워 넣음 (Edge Function 배포가 안 되어 있으면 에러 메시지가 뜸)
    async function startRecording() {
      const errorBox = document.getElementById('recErrorBox');
      errorBox.style.display = 'none';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
          stream.getTracks().forEach(track => track.stop());
          clearInterval(recTimerHandle);
          document.getElementById('recTimer').style.display = 'none';
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          document.getElementById('recStatus').textContent = 'AI가 녹음 내용을 정리하는 중이에요... (음성 길이에 따라 몇 초~1분 정도 걸려요)';
          try {
            const result = await transcribeAndSummarize(blob);
            document.getElementById('mt_transcript').value = result.transcript || '';
            document.getElementById('mt_summary').value = result.summary || '';
            document.getElementById('recStatus').textContent = result.summary ? '✅ AI 정리가 완료됐어요. 아래 내용을 확인하고 저장해주세요.' : (result.warning || '전사는 됐는데 요약은 실패했어요. 전사 내용을 참고해 직접 요약해주세요.');
          } catch (err) {
            errorBox.textContent = err.message;
            errorBox.style.display = 'block';
            document.getElementById('recStatus').textContent = '';
          }
        };
        mediaRecorder.start();
        recSeconds = 0;
        document.getElementById('recTimer').style.display = '';
        document.getElementById('recTimer').textContent = '00:00';
        recTimerHandle = setInterval(() => {
          recSeconds += 1;
          document.getElementById('recTimer').textContent = fmtTimer(recSeconds);
        }, 1000);
        document.getElementById('recStartBtn').style.display = 'none';
        document.getElementById('recStopBtn').style.display = '';
        document.getElementById('recStatus').textContent = '🔴 녹음 중...';
      } catch (err) {
        errorBox.textContent = '마이크를 사용할 수 없어요. 브라우저의 마이크 권한을 허용해주세요. (' + err.message + ')';
        errorBox.style.display = 'block';
      }
    }
    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
      document.getElementById('recStartBtn').style.display = '';
      document.getElementById('recStopBtn').style.display = 'none';
    }
    document.getElementById('recStartBtn').addEventListener('click', startRecording);
    document.getElementById('recStopBtn').addEventListener('click', stopRecording);

    function renderMeetingCard(m) {
      const canEdit = currentUserRole === 'manager' || m.author_id === currentUserId;
      const authorName = m.author ? m.author.name : '알 수 없음';
      return `
        <div class="card" style="padding:16px; margin-bottom:12px;">
          <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
            <div>
              <div style="font-size:14px; font-weight:700;">${m.title}</div>
              <div class="muted" style="font-size:12px; margin-top:2px;">${m.meeting_date} · 작성자 ${authorName}${m.attendees ? ' · 참석자 ' + m.attendees : ''}</div>
            </div>
            ${canEdit ? `<button type="button" class="btn-link" style="color:#dc2626;" onclick="handleDeleteMeeting('${m.id}')">삭제</button>` : ''}
          </div>
          ${m.summary ? `<div style="margin-top:10px; white-space:pre-wrap; font-size:13px; line-height:1.6;">${m.summary}</div>` : ''}
          ${m.memo ? `<div class="muted" style="margin-top:8px; font-size:12px; white-space:pre-wrap;">📝 ${m.memo}</div>` : ''}
          ${m.transcript ? `<details style="margin-top:8px;"><summary class="muted" style="font-size:12px; cursor:pointer;">전체 대화 전사 보기</summary><div class="muted" style="font-size:12px; white-space:pre-wrap; margin-top:6px;">${m.transcript}</div></details>` : ''}
        </div>
      `;
    }

    function renderMeetingList() {
      const container = document.getElementById('meetingListBody');
      if (meetingsCache.length === 0) {
        container.innerHTML = '<p class="muted" style="padding:16px;">아직 기록된 미팅이 없습니다.</p>';
        return;
      }
      container.innerHTML = meetingsCache.map(renderMeetingCard).join('');
    }

    async function handleDeleteMeeting(id) {
      if (!confirm('이 미팅 기록을 삭제할까요?')) return;
      try {
        await deleteMeetingLog(id);
        meetingsCache = meetingsCache.filter(m => m.id !== id);
        renderMeetingList();
      } catch (err) {
        alert(err.message);
      }
    }

    async function loadMeetings() {
      try {
        meetingsCache = await fetchMeetingLogs();
        renderMeetingList();
      } catch (err) {
        document.getElementById('meetingListBody').innerHTML = `<div class="error-text" style="display:block;">${err.message}</div>`;
      }
    }

    document.getElementById('addMeetingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('addErrorBox');
      const successBox = document.getElementById('addSuccessBox');
      errorBox.style.display = 'none';
      successBox.style.display = 'none';
      try {
        await addMeetingLog({
          author_id: currentUserId,
          meeting_date: document.getElementById('mt_date').value,
          title: document.getElementById('mt_title').value.trim(),
          attendees: document.getElementById('mt_attendees').value.trim() || null,
          summary: document.getElementById('mt_summary').value.trim() || null,
          memo: document.getElementById('mt_memo').value.trim() || null,
          transcript: document.getElementById('mt_transcript').value.trim() || null
        });
        successBox.textContent = '미팅 기록이 저장되었습니다.';
        successBox.style.display = 'block';
        document.getElementById('mt_title').value = '';
        document.getElementById('mt_attendees').value = '';
        document.getElementById('mt_summary').value = '';
        document.getElementById('mt_memo').value = '';
        document.getElementById('mt_transcript').value = '';
        document.getElementById('recStatus').textContent = '';
        document.getElementById('mt_date').value = new Date().toISOString().slice(0, 10);
        loadMeetings();
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      }
    });

    (async () => {
      const profile = await getMyProfile();
      if (profile) {
        document.getElementById('roleBadge').textContent = `${profile.role === 'manager' ? '지점장' : '트레이너'} · ${profile.name}`;
        applyRoleNav(profile);
        currentUserId = profile.id;
        currentUserRole = profile.role;
      }
      loadMeetings();
    })();
  </script>
</body>
</html>
