<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>센터 그룹PT 출석</title>
<!--
  이 페이지는 gym-ops의 다른 모든 화면과 달리 "로그인 없이" 인터넷에 열려있는 회원용 화면이에요.
  그래서 auth.js/data.js를 쓰지 않고(그 둘은 직원 로그인 세션이 있다고 가정하는 코드라서), config.js의
  SUPABASE_URL/SUPABASE_ANON_KEY 상수만 재사용해서 migration_55의 anon 전용 함수 4개만 직접 호출해요.
  - group_pt_search_members : 이름/전화번호 뒷자리로 본인 찾기(최초 1회)
  - group_pt_validate_token : 지금 URL의 ?t= 값이 "오늘" 발급된 QR이 맞는지 확인
  - group_pt_checkin        : 실제 출석 체크(서버가 직접 오늘 날짜·토큰을 다시 검증함)
  - group_pt_get_member_status : 캘린더/포인트/보상 로드맵 조회
-->
<style>
  :root {
    --brand: #3D5FFF; --brand-dark: #2A46E0; --brand-bg: #EEF1FF;
    --ink: #16192E; --muted: #6B7280; --line: #E7E9F2; --panel: #F6F7FB;
    --green: #16A34A; --green-bg: #E7F8ED; --gold: #F5A524;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    color: var(--ink); max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative;
  }
  .appbar { display: flex; align-items: center; gap: 8px; padding: 20px 24px 4px; }
  .appbar .logo { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; }
  .appbar .name { font-weight: 800; font-size: 16px; letter-spacing: -0.3px; }

  .view { display: none; }
  .view.active { display: block; }

  /* ---- QR 없이 들어온 경우 ---- */
  .plain-msg { padding: 80px 30px; text-align: center; }
  .plain-msg .ic { font-size: 40px; margin-bottom: 14px; }
  .plain-msg h1 { font-size: 18px; margin: 0 0 8px; }
  .plain-msg p { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }

  /* ---- 본인 확인 ---- */
  .hero { padding: 18px 24px 4px; }
  .hero h1 { margin: 0 0 4px; font-size: 21px; font-weight: 800; line-height: 1.35; }
  .hero .sub { font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 8px; padding: 18px 24px 6px; }
  .tab { flex: 1; text-align: center; padding: 11px 0; border-radius: 999px; font-size: 13.5px; font-weight: 700; border: 1.5px solid var(--line); color: var(--muted); background: #fff; cursor: pointer; }
  .tab.active { background: var(--brand-bg); color: var(--brand); border-color: var(--brand-bg); }
  .field-wrap { padding: 12px 24px 4px; }
  .field { display: flex; align-items: center; gap: 10px; background: var(--panel); border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 16px; }
  .field .ic { color: var(--muted); font-size: 15px; }
  .field input { border: none; background: transparent; outline: none; font-size: 15px; width: 100%; font-family: inherit; color: var(--ink); }
  .search-hint { padding: 8px 26px 0; font-size: 11.5px; color: var(--muted); }
  .result-wrap { margin: 14px 24px 0; display: flex; flex-direction: column; gap: 8px; }
  .m-card { display: flex; align-items: center; gap: 12px; padding: 13px 15px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; cursor: pointer; text-align: left; width: 100%; font-family: inherit; }
  .m-card:active, .m-card.selected { border-color: var(--brand); background: var(--brand-bg); }
  .m-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--panel); color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; flex: 0 0 auto; }
  .m-card.selected .m-avatar { background: var(--brand); color: #fff; }
  .m-name { font-size: 14.5px; font-weight: 800; }
  .m-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .m-check { margin-left: auto; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; border: 1.5px solid var(--line); flex: 0 0 auto; }
  .m-card.selected .m-check { background: var(--brand); color: #fff; border-color: var(--brand); }
  .cta { padding: 22px 24px 24px; }
  .cta button { width: 100%; padding: 15px; border: none; border-radius: 16px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; }
  .cta button[disabled] { opacity: .45; }
  .hint { padding: 0 24px 20px; font-size: 11.5px; color: var(--muted); text-align: center; line-height: 1.6; }
  .err-text { padding: 0 24px; font-size: 12.5px; color: #DC2626; margin-top: 6px; }

  /* ---- 캘린더 화면 ---- */
  .cal-hero { padding: 18px 24px 4px; }
  .cal-hero h1 { margin: 0 0 4px; font-size: 20px; font-weight: 800; line-height: 1.35; }
  .cal-hero .sub { font-size: 12.5px; color: var(--muted); }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 16px 24px 4px; }
  .stat-box { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 6px; text-align: center; }
  .stat-box .label { font-size: 10.5px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .stat-box .value { font-size: 17px; font-weight: 800; }
  .cal-wrap { padding: 20px 24px 8px; }
  .cal-head { font-size: 14.5px; font-weight: 800; margin-bottom: 12px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cal-wd { text-align: center; font-size: 10.5px; color: var(--muted); padding-bottom: 4px; font-weight: 600; }
  .cal-cell { aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #A6A9BC; background: var(--panel); }
  .cal-cell.blank { visibility: hidden; }
  .cal-cell.attended { background: var(--green-bg); color: var(--green); font-weight: 800; font-size: 15px; }
  .cal-cell.today-pending { background: var(--brand); color: #fff; font-weight: 800; font-size: 11px; cursor: pointer; box-shadow: 0 8px 16px -8px rgba(61,95,255,0.6); border: none; font-family: inherit; }
  .cal-cell.today-muted { background: #fff; border: 1.5px dashed var(--line); color: var(--muted); font-weight: 700; }
  .legend { display: flex; gap: 14px; padding: 12px 24px 0; font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; }
  .legend .sw.on { background: var(--green-bg); border: 1px solid var(--green); }
  .legend .sw.pending { background: var(--brand); }
  .roadmap { margin: 22px 24px 0; }
  .roadmap .rm-title { font-size: 12.5px; font-weight: 800; margin-bottom: 10px; }
  .rm-item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .rm-item:last-child { border-bottom: none; }
  .rm-dot { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex: 0 0 auto; }
  .rm-dot.done { background: var(--green-bg); color: var(--green); }
  .rm-dot.active { background: var(--brand-bg); color: var(--brand); font-weight: 800; font-size: 10px; }
  .rm-dot.todo { background: var(--panel); color: var(--muted); font-size: 10px; }
  .rm-txt .name { font-size: 12.5px; font-weight: 700; }
  .rm-txt .sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
  .rm-badge { margin-left: auto; font-size: 10px; font-weight: 700; padding: 3px 8px; border-radius: 999px; }
  .rm-badge.done { background: var(--green-bg); color: var(--green); }
  .rm-badge.active { background: #FFF3DD; color: #92400e; }
  .reset-link { display: block; text-align: center; padding: 24px 24px 30px; font-size: 11.5px; color: var(--muted); text-decoration: underline; background: none; border: none; font-family: inherit; width: 100%; cursor: pointer; }

  /* ---- 포인트 적립 팝업 ---- */
  .overlay { position: fixed; inset: 0; background: rgba(15,17,35,0.5); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .18s; z-index: 50; }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .popup { width: min(88vw, 300px); background: #fff; border-radius: 24px; padding: 30px 26px 26px; text-align: center; box-shadow: 0 30px 60px -20px rgba(15,17,35,0.5); transform: scale(.92); transition: transform .18s; }
  .overlay.show .popup { transform: scale(1); }
  .coin { width: 78px; height: 78px; margin: 0 auto 16px; border-radius: 50%; background: linear-gradient(150deg, #FFE9B8, var(--gold)); display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: 800; color: #fff; box-shadow: 0 12px 22px -10px rgba(245,165,36,0.6); }
  .popup.is-error .coin { background: linear-gradient(150deg, #fee2e2, #fca5a5); }
  .popup .big { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
  .popup .plus { font-size: 26px; font-weight: 900; color: var(--gold); margin-bottom: 10px; }
  .popup .total { font-size: 12.5px; color: var(--muted); margin-bottom: 22px; }
  .popup .total strong { color: var(--ink); }
  .popup button { width: 100%; padding: 13px; border: none; border-radius: 14px; background: var(--brand); color: #fff; font-size: 14.5px; font-weight: 800; font-family: inherit; cursor: pointer; }

  .loading-dim { opacity: .5; pointer-events: none; }
</style>
</head>
<body>
  <div class="appbar"><span class="logo">C</span><span class="name">센터 그룹PT</span></div>

  <div class="view" id="viewNoToken">
    <div class="plain-msg">
      <div class="ic">📱</div>
      <h1>QR을 스캔해서 들어와주세요</h1>
      <p>프런트에 있는 "오늘의 출석 QR"을<br/>휴대폰 카메라로 비춰주시면 돼요</p>
    </div>
  </div>

  <div class="view" id="viewIdentify">
    <div class="hero">
      <h1>본인 확인 후<br/>출석 체크를 진행해요</h1>
      <div class="sub">이름 또는 전화번호 뒷자리 4자리로 찾아주세요</div>
    </div>
    <div class="tabs">
      <button type="button" class="tab active" id="tabName">이름으로 찾기</button>
      <button type="button" class="tab" id="tabPhone">전화번호 뒷자리</button>
    </div>
    <div class="field-wrap">
      <div class="field"><span class="ic">🔍</span><input id="searchInput" placeholder="이름을 입력해주세요" /></div>
    </div>
    <div class="search-hint" id="searchHint"></div>
    <div class="result-wrap" id="resultWrap"></div>
    <div class="err-text" id="identifyErr" style="display:none;"></div>
    <div class="cta"><button type="button" id="confirmIdentityBtn" disabled>본인 확인하고 계속하기</button></div>
    <div class="hint">본인이 아닌 다른 회원님을 선택하면 출석이 잘못 기록될 수 있어요</div>
  </div>

  <div class="view" id="viewCalendar">
    <div class="cal-hero">
      <h1 id="calGreeting">-</h1>
      <div class="sub" id="calSub">캘린더의 파란 칸을 눌러 오늘 출석을 체크해주세요</div>
    </div>
    <div class="stat-row">
      <div class="stat-box"><div class="label">누적 출석</div><div class="value" id="statTotalDays">-</div></div>
      <div class="stat-box"><div class="label">포인트</div><div class="value" id="statPoints">-</div></div>
    </div>
    <div class="cal-wrap">
      <div class="cal-head" id="calMonthLabel">-</div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div class="legend">
      <span><span class="sw on"></span>출석 완료</span>
      <span><span class="sw pending"></span>오늘, 탭하면 출석</span>
    </div>
    <div class="roadmap">
      <div class="rm-title">보상 로드맵</div>
      <div id="roadmapList"></div>
    </div>
    <button type="button" class="reset-link" id="resetIdentityBtn">본인이 아니신가요? 다시 확인하기</button>
  </div>

  <div class="overlay" id="overlay">
    <div class="popup" id="popupBox">
      <div class="coin" id="popupCoin">P</div>
      <div class="big" id="popupTitle">출석 체크 완료!</div>
      <div class="plus" id="popupPlus">+10P 적립</div>
      <div class="total" id="popupTotal"></div>
      <button id="confirmBtn">확인</button>
    </div>
  </div>

  <script src="config.js?v=1790131352"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const qrToken = params.get('t');
    const STORAGE_KEY = 'gymops_attend_member_id';

    async function callRpc(fnName, payload) {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fnName}`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
        },
        body: JSON.stringify(payload || {})
      });
      if (!res.ok) {
        let msg = '요청 처리 중 문제가 발생했어요.';
        try { const j = await res.json(); if (j && j.message) msg = j.message; } catch (e) {}
        throw new Error(msg);
      }
      return res.json();
    }

    function showView(id) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    // ---- 본인 확인 화면 ----
    let searchMode = 'name'; // 'name' | 'phone'
    let selectedCandidate = null;
    let searchDebounce = null;

    document.getElementById('tabName').addEventListener('click', () => {
      searchMode = 'name';
      document.getElementById('tabName').classList.add('active');
      document.getElementById('tabPhone').classList.remove('active');
      document.getElementById('searchInput').placeholder = '이름을 입력해주세요';
      document.getElementById('searchInput').value = '';
      resetSearchResults();
    });
    document.getElementById('tabPhone').addEventListener('click', () => {
      searchMode = 'phone';
      document.getElementById('tabPhone').classList.add('active');
      document.getElementById('tabName').classList.remove('active');
      document.getElementById('searchInput').placeholder = '전화번호 뒷자리 4자리';
      document.getElementById('searchInput').value = '';
      resetSearchResults();
    });

    function resetSearchResults() {
      selectedCandidate = null;
      document.getElementById('resultWrap').innerHTML = '';
      document.getElementById('confirmIdentityBtn').disabled = true;
      document.getElementById('identifyErr').style.display = 'none';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      resetSearchResults();
      const q = e.target.value.trim();
      clearTimeout(searchDebounce);
      const minLen = searchMode === 'phone' ? 4 : 2;
      if (q.length < minLen) {
        document.getElementById('searchHint').textContent = searchMode === 'phone' ? '뒷자리 4자리를 입력해주세요' : '2글자 이상 입력해주세요';
        return;
      }
      document.getElementById('searchHint').textContent = '';
      searchDebounce = setTimeout(() => runSearch(q), 300);
    });

    async function runSearch(q) {
      try {
        const rows = await callRpc('group_pt_search_members', { p_query: q });
        renderSearchResults(rows);
      } catch (err) {
        document.getElementById('identifyErr').textContent = err.message;
        document.getElementById('identifyErr').style.display = 'block';
      }
    }

    function renderSearchResults(rows) {
      const wrap = document.getElementById('resultWrap');
      if (!rows || rows.length === 0) {
        wrap.innerHTML = `<div class="hint" style="padding:8px 0;">일치하는 회원을 찾지 못했어요. 프런트 직원에게 문의해주세요.</div>`;
        return;
      }
      wrap.innerHTML = rows.map(r => `
        <button type="button" class="m-card" data-id="${r.member_id}" data-name="${r.display_name}" data-class="${r.class_label || ''}">
          <div class="m-avatar">${(r.display_name || '?').slice(0,1)}</div>
          <div><div class="m-name">${r.display_name}</div><div class="m-sub">${r.class_label || '그룹PT'}${r.phone_hint ? ' · ' + r.phone_hint : ''}</div></div>
          <div class="m-check"></div>
        </button>
      `).join('');
      wrap.querySelectorAll('.m-card').forEach(card => {
        card.addEventListener('click', () => {
          wrap.querySelectorAll('.m-card').forEach(c => { c.classList.remove('selected'); c.querySelector('.m-check').textContent = ''; });
          card.classList.add('selected');
          card.querySelector('.m-check').textContent = '✓';
          selectedCandidate = { id: card.dataset.id, name: card.dataset.name };
          document.getElementById('confirmIdentityBtn').disabled = false;
        });
      });
    }

    document.getElementById('confirmIdentityBtn').addEventListener('click', () => {
      if (!selectedCandidate) return;
      try { localStorage.setItem(STORAGE_KEY, selectedCandidate.id); } catch (e) {}
      loadCalendarView(selectedCandidate.id);
    });

    document.getElementById('resetIdentityBtn').addEventListener('click', () => {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      if (!qrToken) { showView('viewNoToken'); return; }
      resetSearchResults();
      document.getElementById('searchInput').value = '';
      showView('viewIdentify');
    });

    // ---- 캘린더 화면 ----
    let statusCache = null;
    let hasValidTodayToken = false;

    async function loadCalendarView(memberId) {
      showView('viewCalendar');
      document.getElementById('calGreeting').textContent = '불러오는 중...';
      try {
        const [statusRows, valid] = await Promise.all([
          callRpc('group_pt_get_member_status', { p_member_id: memberId }),
          qrToken ? callRpc('group_pt_validate_token', { p_token: qrToken }) : Promise.resolve(false)
        ]);
        statusCache = (statusRows && statusRows[0]) || null;
        hasValidTodayToken = !!valid;
      } catch (err) {
        document.getElementById('calGreeting').textContent = '불러오지 못했어요';
        document.getElementById('calSub').textContent = err.message;
        return;
      }
      if (!statusCache) {
        document.getElementById('calGreeting').textContent = '회원 정보를 찾을 수 없어요';
        return;
      }
      renderCalendarView();
    }

    function renderCalendarView() {
      const s = statusCache;
      document.getElementById('calGreeting').textContent = `${s.display_name}님, 오늘도 출석해볼까요? 😊`;
      document.getElementById('statTotalDays').textContent = s.total_days + '일';
      document.getElementById('statPoints').textContent = s.total_points + 'P';

      const today = new Date();
      const todayStr = formatLocalDate(today);
      const attendedSet = new Set(s.attendance_dates || []);
      const alreadyToday = attendedSet.has(todayStr);
      const showTodayBtn = hasValidTodayToken && !alreadyToday;

      document.getElementById('calSub').textContent = showTodayBtn
        ? '캘린더의 파란 칸을 눌러 오늘 출석을 체크해주세요'
        : (alreadyToday ? '오늘 출석은 이미 완료됐어요. 내일 또 만나요!' : 'QR을 다시 스캔하면 오늘 출석 체크를 할 수 있어요');

      const monthStr = todayStr.slice(0, 7);
      const [y, m] = monthStr.split('-').map(Number);
      const totalDays = new Date(y, m, 0).getDate();
      const firstWeekday = new Date(y, m - 1, 1).getDay();
      document.getElementById('calMonthLabel').textContent = `${y}년 ${m}월`;

      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';
      ['일','월','화','수','목','금','토'].forEach(w => {
        const d = document.createElement('div'); d.className = 'cal-wd'; d.textContent = w; grid.appendChild(d);
      });
      for (let i = 0; i < firstWeekday; i++) {
        const d = document.createElement('div'); d.className = 'cal-cell blank'; grid.appendChild(d);
      }
      for (let day = 1; day <= totalDays; day++) {
        const dateStr = `${monthStr}-${String(day).padStart(2, '0')}`;
        const el = document.createElement(dateStr === todayStr && showTodayBtn ? 'button' : 'div');
        el.type = dateStr === todayStr && showTodayBtn ? 'button' : undefined;
        if (attendedSet.has(dateStr)) {
          el.className = 'cal-cell attended';
          el.textContent = '✓';
        } else if (dateStr === todayStr) {
          if (showTodayBtn) {
            el.className = 'cal-cell today-pending';
            el.textContent = '출석';
            el.id = 'todayCheckinBtn';
          } else {
            el.className = 'cal-cell today-muted';
            el.textContent = String(day);
          }
        } else {
          el.className = 'cal-cell';
          el.textContent = String(day);
          if (dateStr > todayStr) el.style.color = '#D3D5E2';
        }
        grid.appendChild(el);
      }
      renderRoadmap();

      const btn = document.getElementById('todayCheckinBtn');
      if (btn) btn.addEventListener('click', handleCheckin);
    }

    function renderRoadmap() {
      const list = document.getElementById('roadmapList');
      const tiers = statusCache.tiers || [];
      if (tiers.length === 0) { list.innerHTML = `<div class="hint" style="padding:0;">아직 설정된 보상 단계가 없어요.</div>`; return; }
      list.innerHTML = tiers.map(t => {
        const dotClass = t.fulfilled || t.achieved ? 'done' : (statusCache.total_days < t.days_required ? 'todo' : 'active');
        const dotContent = t.achieved ? '✓' : `${statusCache.total_days}/${t.days_required}`;
        const badge = t.fulfilled
          ? `<div class="rm-badge done">수령 완료</div>`
          : (t.achieved ? `<div class="rm-badge active">지급 예정</div>` : (statusCache.total_days < t.days_required ? '' : ''));
        return `<div class="rm-item">
          <div class="rm-dot ${dotClass}">${dotContent}</div>
          <div class="rm-txt"><div class="name">${t.days_required}일 출석</div><div class="sub">${t.reward_name}</div></div>
          ${badge}
        </div>`;
      }).join('');
    }

    function formatLocalDate(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    async function handleCheckin() {
      const btn = document.getElementById('todayCheckinBtn');
      if (btn) btn.classList.add('loading-dim');
      try {
        const rows = await callRpc('group_pt_checkin', { p_member_id: getSavedMemberId(), p_token: qrToken });
        const r = rows && rows[0];
        if (!r) throw new Error('알 수 없는 오류가 발생했어요.');
        openPopup(r);
      } catch (err) {
        openPopup({ ok: false, message: err.message });
      }
    }

    function openPopup(result) {
      const popup = document.getElementById('popupBox');
      popup.classList.toggle('is-error', !result.ok);
      document.getElementById('popupCoin').textContent = result.ok ? 'P' : '!';
      document.getElementById('popupTitle').textContent = result.ok ? '출석 체크 완료!' : '앗, 잠깐만요';
      document.getElementById('popupPlus').textContent = result.ok ? `+${result.points_earned}P 적립` : (result.message || '문제가 발생했어요');
      document.getElementById('popupPlus').style.color = result.ok ? '' : '#DC2626';
      document.getElementById('popupTotal').innerHTML = result.ok ? `현재 누적 포인트 <strong>${result.total_points}P</strong>` : '';
      document.getElementById('overlay').classList.add('show');
      document.getElementById('overlay').dataset.wasOk = result.ok ? '1' : '0';
    }

    document.getElementById('confirmBtn').addEventListener('click', async () => {
      document.getElementById('overlay').classList.remove('show');
      const wasOk = document.getElementById('overlay').dataset.wasOk === '1';
      if (wasOk) {
        await loadCalendarView(getSavedMemberId());
      } else {
        const btn = document.getElementById('todayCheckinBtn');
        if (btn) btn.classList.remove('loading-dim');
      }
    });

    function getSavedMemberId() {
      try { return localStorage.getItem(STORAGE_KEY); } catch (e) { return null; }
    }

    // ---- 진입점 ----
    (function init() {
      const savedId = getSavedMemberId();
      if (savedId) {
        loadCalendarView(savedId);
      } else if (qrToken) {
        showView('viewIdentify');
      } else {
        showView('viewNoToken');
      }
    })();
  </script>
</body>
</html>
