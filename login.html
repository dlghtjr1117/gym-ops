<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("gymops_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
<title>센터 매출 관리 - 로그인</title>
<link rel="stylesheet" href="style.css?v=1790336916" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-hero">
      <div class="auth-hero-inner">
        <img class="auth-hero-logo" src="assets/logo-lockup.png" alt="Everywhere Fitness" />
        <p class="auth-hero-tagline">로그인하고 매출 · 회원 현황을 확인하세요</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-inner">
        <div class="auth-header">
          <div class="auth-brand"><span>Everywhere</span><span>Fitness</span></div>
          <h1>로그인</h1>
          <p>이메일과 비밀번호를 입력해주세요</p>
        </div>

        <div id="successBox" class="success-text"></div>
        <div id="errorBox" class="error-text"></div>

        <form id="loginForm">
          <div class="auth-field">
            <div class="auth-field-head">
              <label>이메일</label>
            </div>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required />
          </div>
          <div class="auth-field">
            <div class="auth-field-head">
              <label>비밀번호</label>
              <a href="forgot-password.html" class="auth-forgot-link">비밀번호를 잊으셨나요?</a>
            </div>
            <div class="auth-password-wrap">
              <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required />
              <button type="button" class="auth-toggle-pw" id="togglePwBtn" aria-label="비밀번호 표시">👁️</button>
            </div>
          </div>
          <button type="submit" class="auth-btn" id="submitBtn">로그인</button>
        </form>

        <p class="auth-hint">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
      </div>
    </div>
  </div>

  <script src="config.js?v=1790336916"></script>
  <script src="auth.js?v=1790336916"></script>
  <script>
    // 이미 로그인되어 있으면 바로 홈 화면으로
    if (getSession()) location.href = 'home.html';

    const form = document.getElementById('loginForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    // 로그인 세션이 만료되어 자동으로 이 페이지로 넘어온 경우 안내 문구 표시
    if (new URLSearchParams(location.search).get('expired') === '1') {
      errorBox.textContent = '로그인이 만료되어 다시 로그인해주세요.';
      errorBox.style.display = 'block';
    }

    // 비밀번호 재설정 후 돌아온 경우 안내 문구 표시
    const successBox = document.getElementById('successBox');
    if (new URLSearchParams(location.search).get('reset') === '1') {
      successBox.textContent = '비밀번호가 변경됐어요. 새 비밀번호로 로그인해주세요.';
      successBox.style.display = 'block';
    }

    // 비밀번호 표시/숨김 토글
    document.getElementById('togglePwBtn').addEventListener('click', () => {
      const pwInput = document.getElementById('password');
      const btn = document.getElementById('togglePwBtn');
      const showing = pwInput.type === 'text';
      pwInput.type = showing ? 'password' : 'text';
      btn.textContent = showing ? '👁️' : '🙈';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '로그인 중...';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await signIn(email, password);
        location.href = 'home.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
