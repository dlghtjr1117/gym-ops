<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>try{if(localStorage.getItem("gymops_theme")==="dark"){document.documentElement.setAttribute("data-theme","dark");}}catch(e){}</script>
<title>센터 매출 관리 - 비밀번호 찾기</title>
<link rel="stylesheet" href="style.css?v=1790336916" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-hero">
      <div class="auth-hero-inner">
        <img class="auth-hero-logo" src="assets/logo-lockup.png" alt="Everywhere Fitness" />
        <p class="auth-hero-tagline">가입하신 이메일로 재설정 링크를 보내드려요</p>
      </div>
    </div>

    <div class="auth-form-panel">
      <div class="auth-form-inner">
        <a href="login.html" class="auth-back-link">‹ 로그인으로 돌아가기</a>

        <div id="requestView">
          <div class="auth-header">
            <div class="auth-brand"><span>Everywhere</span><span>Fitness</span></div>
            <h1>비밀번호 찾기</h1>
            <p>가입하신 이메일을 입력해주세요</p>
          </div>

          <div id="errorBox" class="error-text"></div>

          <form id="forgotForm">
            <div class="auth-field">
              <div class="auth-field-head">
                <label>이메일</label>
              </div>
              <input type="email" id="email" placeholder="you@example.com" autocomplete="username" required />
            </div>
            <button type="submit" class="auth-btn" id="submitBtn">재설정 링크 보내기</button>
          </form>

          <div class="auth-note">
            로그인 시 사용하는 이메일 주소가 곧 아이디예요. 어떤 이메일로 가입했는지 기억나지 않으면
            센터 관리자(지점장)에게 문의해주세요.
          </div>

          <p class="auth-hint">아직 계정이 없으신가요? <a href="signup.html">회원가입</a></p>
        </div>

        <div id="doneView" style="display:none; text-align:center;">
          <div class="auth-success-icon">✓</div>
          <p style="font-weight:700; font-size:16px; margin:0 0 8px;">메일을 확인해주세요</p>
          <p style="font-size:13.5px; color:var(--slate-500); margin:0 0 4px; line-height:1.6;" id="doneEmailText"></p>
          <p style="font-size:13.5px; color:var(--slate-500); margin:0; line-height:1.6;">
            메일함에 없으면 스팸함도 확인해주세요. 링크는 1시간 동안만 유효해요.
          </p>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js?v=1790336916"></script>
  <script src="auth.js?v=1790336916"></script>
  <script>
    const form = document.getElementById('forgotForm');
    const errorBox = document.getElementById('errorBox');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '보내는 중...';

      const email = document.getElementById('email').value.trim();

      try {
        await requestPasswordReset(email);
      } catch (err) {
        // 네트워크 오류 등 진짜 예외적인 경우가 아니면 여기로 오지 않음(requestPasswordReset은
        // Supabase 응답 상태를 일부러 확인하지 않음) - 그래도 만약을 대비해 실패 문구는 남겨둠
      }

      document.getElementById('doneEmailText').textContent = `${email} 주소로 링크를 보냈어요.`;
      document.getElementById('requestView').style.display = 'none';
      document.getElementById('doneView').style.display = 'block';
    });
  </script>
</body>
</html>
